name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing (OIDC) needs npm 11.5.1+; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # Opens a version PR when changesets are pending; publishes when that PR
      # is merged. `release` builds first, so dist/ is never stale on npm.
      # Auth is OIDC via npm trusted publishing -- no token, and provenance is
      # attached automatically, so neither is configured here.
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
